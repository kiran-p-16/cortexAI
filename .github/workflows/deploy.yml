name: cortex ai deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }} 

jobs: 

  deploy-backend:
     runs-on: ubuntu-latest 
     steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check AWS Secrets Availability
        id: check-secrets
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}" ]; then
            echo "has_aws_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_aws_secrets=false" >> $GITHUB_OUTPUT
            echo "::notice::AWS credentials not configured in GitHub Repository Secrets. Skipping AWS cloud deployment."
          fi

      - name: aws configure
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Login to ECR
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Gateway
        run: |
          docker build -f backend/gateway/Dockerfile -t gateway backend 

      - name: tag Gateway
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          docker tag gateway:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      - name: push Gateway 
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest  

      - name: Build Auth 
        run: |
          docker build -f backend/services/auth/Dockerfile -t auth-service backend 

      - name: tag auth
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          docker tag auth-service:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest

      - name: push auth 
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest 

      - name: Build Chat 
        run: |
          docker build -f backend/services/chat/Dockerfile -t chat-service backend 

      - name: tag chat
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          docker tag chat-service:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest

      - name: push chat 
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest

      - name: Build agent 
        run: |
          docker build -f backend/services/agent/Dockerfile -t agent-service backend 

      - name: tag agent
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          docker tag agent-service:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest

      - name: push agent 
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest

      - name: Build billing 
        run: |
          docker build -f backend/services/billing/Dockerfile -t billing-service backend 

      - name: tag billing
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          docker tag billing-service:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest

      - name: push billing 
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest  

      - name: deploy gateway
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.GATEWAY_SERVICE}} \
          --force-new-deployment

      - name: deploy auth
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.AUTH_SERVICE}} \
          --force-new-deployment

      - name: deploy chat
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.CHAT_SERVICE}} \
          --force-new-deployment          

      - name: deploy agent
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.AGENT_SERVICE}} \
          --force-new-deployment

      - name: deploy billing
        if: steps.check-secrets.outputs.has_aws_secrets == 'true'
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.BILLING_SERVICE}} \
          --force-new-deployment  

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout
        uses: actions/checkout@v4 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: build frontend
        run: | 
          cd frontend
          npm install
          npm run build        

      - name: Check AWS Secrets Availability
        id: check-secrets-frontend
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}" ]; then
            echo "has_aws_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_aws_secrets=false" >> $GITHUB_OUTPUT
            echo "::notice::AWS credentials not configured in GitHub Repository Secrets. Skipping S3 upload & CloudFront invalidation."
          fi

      - name: aws configure
        if: steps.check-secrets-frontend.outputs.has_aws_secrets == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: upload to s3
        if: steps.check-secrets-frontend.outputs.has_aws_secrets == 'true'
        run: |
          aws s3 sync \
          frontend/dist \
          s3://${{secrets.S3_BUCKET}} \
          --delete

      - name: invalidate cloudfront
        if: steps.check-secrets-frontend.outputs.has_aws_secrets == 'true'
        run: |
          aws cloudfront create-invalidation \
          --distribution-id \
          ${{secrets.CLOUDFRONT_DISTRIBUTION_ID}} \
          --paths "/*"